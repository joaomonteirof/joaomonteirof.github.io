# Site configuration for joaomonteirof.github.io (academicpages theme, a fork of Minimal Mistakes).
# `jekyll serve` does not reload this file; restart the server after editing it.

# Site Settings
locale                   : "en-US"
title                    : "Joao Monteiro"
title_separator          : "-"
name                     : "Joao Monteiro"
description              : "Research scientist working on efficient inference for large language models and on search and retrieval."
url                      : https://joaomonteirof.github.io
baseurl                  : ""
repository               : "joaomonteirof/joaomonteirof.github.io"
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
read_more                : "disabled"

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
social:
  type                   :
  name                   :
  links:

# Analytics
analytics:
  provider               : false

# Site Author (shown in the sidebar)
author:
  name             : "Joao Monteiro"
  avatar           : "profile.jpg"
  bio              : "Research Scientist, Machine Learning"
  location         : "Paris, France"
  googlescholar    : "https://scholar.google.ca/citations?hl=en&user=hkO47vsAAAAJ&view_op=list_works&sortby=pubdate"
  github           : "joaomonteirof"
  linkedin         : "joao-monteiro-47180256"
  twitter          : "joaomonteirof"

# Reading Files
include:
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .jekyll-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - node_modules
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Outputting
permalink: /:categories/:title/
timezone: Europe/Paris

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
